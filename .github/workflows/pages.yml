name: Deploy GitHub Pages

# The Pages site has two parts:
#   site/   the project homepage (static, deployed as is)
#   learn/  the plain-English informalization site, built with Node (no Lean needed), served at /learn/
on:
  push:
    branches:
      - main
  pull_request:
    paths: ["learn/**", "site/**", "Collatz/**", "Results.lean", "Main.lean", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: learn/package-lock.json

      - name: Validate explainer nodes and run the shared tests
        working-directory: learn
        run: |
          npm ci
          python3 -m pip install --quiet pyyaml
          npm test

      - name: Check data/ and nodes/ are in sync with the Lean source and nodes_src
        working-directory: learn
        run: |
          python3 tools/scan_decls.py
          python3 tools/write_nodes.py
          git diff --exit-code data/ nodes/ || { echo "::error::learn/data or learn/nodes is stale; run python3 learn/tools/scan_decls.py && python3 learn/tools/write_nodes.py"; exit 1; }

      - name: Build the informalization site (node pages + browsable Lean source)
        working-directory: learn
        run: npm run build

      - name: Assemble homepage + /learn/
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/learn
          cp -r learn/dist/. _site/learn/

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
